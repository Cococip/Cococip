name: Generate Contribution Snake

on:
schedule:
- cron: "0 */12 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
generate:
name: Generate Contribution Snake
runs-on: ubuntu-latest

```
steps:

  - name: Generate snake
    uses: Platane/snk@v3
    with:
      github_user_name: Cococip

      outputs: |
        dist/github-contribution-grid-snake.svg?color_snake=%23567C34&color_dots=%23EBF1E7,%23C9DDBB,%23A9C58F,%237FAF58,%23567C34
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237FAF58&color_dots=%23161B22,%232E4324,%23476135,%23688F49,%237FAF58

  - name: Publish generated files
    uses: crazy-max/ghaction-github-pages@v4
    with:
      target_branch: output
      build_dir: dist

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
