name: Update Contribution Snake

on:
schedule:
- cron: "0 */12 * * *"

workflow_dispatch:

push:
branches:
- main

permissions:
contents: write

concurrency:
group: contribution-snake
cancel-in-progress: true

jobs:
generate:
name: Generate Contribution Snake
runs-on: ubuntu-latest

```
timeout-minutes: 10

steps:
  - name: Generate snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: ${{ github.repository_owner }}

      outputs: |
        dist/github-snake.svg?color_snake=%23567C34&color_dots=%23EBF1E7,%23C9DDBB,%23A9C58F,%237FAF58,%23567C34
        dist/github-snake-dark.svg?palette=github-dark&color_snake=%237FAF58&color_dots=%23161B22,%232E4324,%23476135,%23688F49,%237FAF58

  - name: Publish snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      target_branch: output
      build_dir: dist

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
