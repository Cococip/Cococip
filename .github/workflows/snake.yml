name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Cococip
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23567C34&color_dots=%23EBF1E7,%23C9DDBB,%23A9C58F,%237FAF58,%23567C34
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237FAF58

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
